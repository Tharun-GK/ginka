[project]
name = "ginka"
version = "1.0.0"
dependencies = [
    "aiohttp>=3.9,<4",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.110,<1",
    "gspread>=6.0,<7",
    "psycopg[binary]>=3.1,<4",
